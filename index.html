<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Undangan Pernikahan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:#faf7f2;text-align:center}
section,#nama-tamu{padding:40px 20px;opacity:0;transform:translateY(30px);transition:.8s}
h1,h2{color:#8b5e3c}
.card{background:#fff;margin:20px auto;max-width:420px;padding:20px;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.08)}
input,textarea,select{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #ccc}
button{padding:10px 24px;border:none;border-radius:30px;background:#8b5e3c;color:#fff}
.ucapan{background:#f7efe7;padding:12px;border-radius:10px;margin:10px 0;text-align:left}
small{color:#777}
#content{display:none}
</style>
</head>

<body>

<div id="cover" style="position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#faf7f2;z-index:9">
<h2>Undangan Pernikahan</h2>
<h1>Nur Hidayati & Ifal Alfarizi</h1>
<button onclick="buka()">💌 Buka Undangan</button>
</div>

<div id="content">

<p id="nama-tamu">Kepada Yth. Bapak/Ibu/Saudara/i</p>

<section class="card">
<h2>Menuju Hari Bahagia</h2>
<h1 id="countdown"></h1>
</section>

<section>
<h1>Nur Hidayati & Ifal Alfarizi</h1>
<p>Dengan memohon rahmat dan ridho Allah SWT</p>
</section>

<section class="card">
<h2>Akad Nikah</h2>
<p>Minggu, 23 Juli 2028<br>09.00 WIB</p>
</section>

<section class="card">
<h2>Resepsi</h2>
<p>Minggu, 23 Juli 2028<br>11.00 WIB</p>
</section>

<section class="card">
<h2>RSVP</h2>
<input id="rsvpNama" placeholder="Nama">
<select id="rsvpHadir">
<option value="">-- Kehadiran --</option>
<option>Hadir</option>
<option>Tidak Hadir</option>
</select>
<button onclick="kirimRSVP()">Kirim</button>
<p id="rsvpMsg"></p>
</section>

<section class="card">
<h2>Ucapan & Doa</h2>
<input id="uNama" placeholder="Nama">
<textarea id="uPesan" placeholder="Ucapan"></textarea>
<button onclick="kirimUcapan()">Kirim</button>
<p id="uMsg"></p>

<div id="listUcapan"></div>
</section>

</div>

<audio id="musik" loop><source src="musik.mp3"></audio>

<script>
const URL="https://script.google.com/macros/s/AKfycbx_4MOmFjETGR2ShFdpqeACMlpRUg_pZMjTbBzogRtOLYZbIdcmTHY4kwAVBA-5cCXK/exec";

function buka(){
cover.style.display="none";
content.style.display="block";
document.querySelectorAll("section,#nama-tamu").forEach((e,i)=>setTimeout(()=>{e.style.opacity=1;e.style.transform="none"},i*250));
musik.play();
loadUcapan();
}

setInterval(()=>countdown.innerText=Math.floor((new Date("2028-07-23")-new Date())/86400000)+" Hari Lagi",1000);

const p=new URLSearchParams(location.search);
if(p.get("to")){
nama_tamu.innerText="Kepada Yth. "+decodeURIComponent(p.get("to"));
rsvpNama.value=uNama.value=decodeURIComponent(p.get("to"));
}

function kirimRSVP(){
fetch(URL,{method:"POST",body:JSON.stringify({type:"rsvp",nama:rsvpNama.value,kehadiran:rsvpHadir.value})})
.then(()=>rsvpMsg.innerText="RSVP terkirim 🙏");
}

function kirimUcapan(){
fetch(URL,{method:"POST",body:JSON.stringify({type:"ucapan",nama:uNama.value,pesan:uPesan.value})})
.then(()=>{uMsg.innerText="Ucapan terkirim 💖";uPesan.value="";loadUcapan();});
}

function loadUcapan(){
fetch(URL).then(r=>r.json()).then(d=>{
listUcapan.innerHTML=d.reverse().map(x=>`
<div class="ucapan">
<strong>${x.nama}</strong><br>
${x.pesan}<br>
<small>${new Date(x.waktu).toLocaleString()}</small>
</div>`).join("");
});
}
</script>

</body>
</html>
